services:
  app:
    build:
      context: .
      args:
        dev: 0
    command: /bin/sh /srv/app/wsgi.sh
    restart: unless-stopped
    env_file:
      - env/prod.env
    volumes:
      - /mnt/crfpa-videos:/mnt/crfpa-videos
      - /mnt/crfpa-items:/mnt/crfpa-items
    networks:
      - teleforma-prod
  
  channels:
    build:
      context: .
      args:
        dev: 0
    command: /bin/sh /srv/app/asgi.sh
    restart: unless-stopped
    volumes:
      - ./app/:/srv/app
      - ./bin:/srv/bin
      - ./lib:/srv/lib
      - ./teleforma/:/srv/src/teleforma/teleforma
      - ./var/log/app:/var/log/app
    env_file:
      - env/prod.env
    networks:
      - teleforma-prod
    links:
      - db:db
      - redis
      - memcached
    depends_on:
      - db
      - redis
      - memcached

  db:
    restart: unless-stopped
    env_file:
      - env/prod.env
    networks:
      - teleforma-prod

  redis:
    restart: unless-stopped
    networks:
      - teleforma-prod

  memcached:
    restart: unless-stopped
    networks:
      - teleforma-prod


volumes:
    app:
    channels:
    db:
    redis:


networks:
  teleforma-prod:
    driver: bridge
