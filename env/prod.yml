version: '3'

services:
  app:
    build:
      context: .
      args:
        dev: 0
    command: /bin/sh /srv/app/wsgi.sh
    restart: unless-stopped
    env_file:
      - env/prod.env
    volumes:
      - /mnt/ae-videos:/srv/media

  db:
    env_file:
      - env/prod.env

volumes:
    app:
    channels:
    db:

