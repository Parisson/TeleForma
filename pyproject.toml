[tool.poetry]
name = "teleforma"
version = "3.0.0"
description = "e-learning platform based on streaming"
authors = ["Guillaume Pellerin <guillaume.pellerin@parisson.com>"]
license = "CeCILL v2"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
bigbluebutton-api-python = "0.0.11"
channels = "4.3.2"
channels-redis = "^4.3.0"
docutils = "0.17.1"
django = "^5.2"
djangorestframework = "^3.16.0"
django-debug-toolbar = "^5.1.0"
dj-pagination = "2.5.0"                    # archived — to replace with Django built-in pagination ?
django-jazzmin = "^3.0.3"
django-json-rpc = "0.7.1"                  # abandoned — to replace with django-modern-rpc ?
django-nvd3 = "0.9.7"                      # abandoned — to replace with Chart.js / django-chartjs ?
django-postman = "4.5"
django-tinymce = "^5.0.0"
django-unique-session = "1.0.0"            # abandoned — to replace with django-single-session ?
django-user-agents = "0.4.0"               # abandoned — to replace with fork or custom middleware ?
django-recaptcha = "^4.0.0"
jxmlease = "1.0.3"
numpy = "1.26.4"
pypdf = "4.2.0"
pymemcache = "3.4.4"
requests = "^2.31.0"
sorl-thumbnail = "^13.0.0"
unidecode = "1.2.0"
weasyprint = "^63.0"
xlrd = "2.0.1"
xlwt = "1.3.0"
psycopg2 = "^2.9.11"
redis = "^4.6.0"
uwsgi = "^2.0.31"
uvicorn = {version = "0.18.1", extras = ["standard"]}
httpx = "0.23.3"
django-storages = {extras = ["s3"], version = "^1.14.2"}
boto3 = "^1.34.89"
ipython = "^8.23.0"
reportlab = "^4.2.0"
django-quiz-app = {git = "https://github.com/Parisson/Django-Quiz.git", rev = "crfpa"}
django-cors-headers = "^4.7.0"
watchfiles = "1.1.1"
pycryptodome = "^3.23.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
