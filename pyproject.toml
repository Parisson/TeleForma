[tool.poetry]
name = "teleforma"
version = "2.8.0"
description = "e-learning platform based on streaming"
authors = ["Guillaume Pellerin <guillaume.pellerin@parisson.com>"]
license = "CeCILL v2"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
bigbluebutton-api-python = "0.0.11"
channels = "3.0.4"
channels-redis = "3.4.0"
docutils = "0.17.1"
daphne = "3.0.2"
django = "3.2.25"
djangorestframework = "3.13.1"
django-debug-toolbar = "3.2.1"
dj-pagination = "2.5.0"
django-jazzmin = "2.4.7"
django-json-rpc = "0.7.1"
django-nvd3 = "0.9.7"
django-postman = "4.2"
django-tinymce = "3.3.0"
django-unique-session = "1.0.0"
django-user-agents = "0.4.0"
django-recaptcha = "2.0.6"
jxmlease = "1.0.3"
numpy = "1.26.4"
pypdf = "4.2.0"
pymemcache = "3.4.4"
requests = "^2.31.0"
sorl-thumbnail = "12.10.0"
unidecode = "1.2.0"
weasyprint = "52.5"
xlrd = "2.0.1"
xlwt = "1.3.0"
psycopg2 = "2.8.6"
redis = "3.5.3"
uwsgi = "2.0.25.1"
uvicorn = {version = "0.18.1", extras = ["standard"]}
httpx = "0.23.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
